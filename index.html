<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nyx — terminal</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/hack-font@3.3.0/build/web/hack.css">
<style>
  :root { --bg:#000; --fg:#d4d4d4; --dim:#7c7c7c; --bright:#fff; --fontscale: 14; }
  * { box-sizing: border-box; }
  html, body {
    margin:0; padding:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:'Hack','Hack Nerd Font','DejaVu Sans Mono','Courier New',monospace;
    font-size: calc(var(--fontscale) * 1px);
    line-height:1.45; -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  ::selection { background:var(--fg); color:var(--bg); }
  #screen {
    position:fixed; inset:0 0 26px 0; overflow-y:auto; overflow-x:hidden;
    padding:14px 18px 30px 18px;
    scrollbar-width:thin; scrollbar-color:#4a4a4a #000;
    cursor:text;
  }
  #screen::-webkit-scrollbar { width:10px; }
  #screen::-webkit-scrollbar-track { background:#000; }
  #screen::-webkit-scrollbar-thumb { background:#3a3a3a; border:2px solid #000; }
  #screen::-webkit-scrollbar-thumb:hover { background:#5a5a5a; }
  .line { white-space:pre-wrap; word-break:break-word; min-height:1.45em; }
  .dim { color:var(--dim); }
  .bright { color:var(--bright); font-weight:700; }
  .err { color:var(--bright); font-weight:700; }
  .bsod-face { color: var(--bright); font-weight:700; font-size:96px; line-height:1.1; padding:24px 0 12px 0; }
  .bsod-title { color: var(--bright); font-weight:700; font-size:22px; line-height:1.4; padding:8px 0 4px 0; }
  #inputline { white-space:pre-wrap; word-break:break-word; }
  #prompt { color:var(--bright); font-weight:700; }
  #typed { color:var(--fg); }
  #cursor { display:inline-block; color:var(--fg); animation:blink 1.1s steps(1,end) infinite; }
  @keyframes blink { 0%,49.99%{opacity:1;} 50%,100%{opacity:0;} }
  #hidden {
    position:fixed; bottom:0; left:0; width:2px; height:2px; opacity:0;
    border:none; outline:none; padding:0; margin:0; background:transparent;
    color:transparent; caret-color:transparent; font-family:inherit;
  }
  #statusbar {
    position:fixed; bottom:0; left:0; right:0; height:26px;
    background:#000; color:var(--dim); border-top:1px solid #222;
    padding:4px 14px; font-size:11px; z-index:100;
    display:flex; justify-content:space-between;
    white-space:nowrap; overflow:hidden;
  }
  #statusbar .right { color:var(--bright); }
</style>
</head>
<body>

<div id="screen">
  <div id="output"></div>
  <div id="inputline" style="display:none;"><span id="prompt"></span><span id="typed"></span><span id="cursor">█</span></div>
</div>
<div id="statusbar"><span class="left"></span><span class="right"></span></div>
<input id="hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" aria-label="terminal input">

<script>
/* Global error handler */
window.addEventListener('error', (e) => {
  document.body.innerHTML = '<pre style="color:#f66;padding:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;background:#000;min-height:100vh;margin:0;">JS ERROR:\n' + (e.error ? e.error.stack : e.message) + '</pre>';
});
window.addEventListener('unhandledrejection', (e) => {
  document.body.innerHTML = '<pre style="color:#f66;padding:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;background:#000;min-height:100vh;margin:0;">PROMISE REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason) + '</pre>';
});

/* ============================================================
   TERMINAL OUTPUT
   ============================================================ */
const screenEl = document.getElementById('screen');
const outputEl = document.getElementById('output');
const promptEl = document.getElementById('prompt');
const typedEl  = document.getElementById('typed');
const hiddenEl = document.getElementById('hidden');
const inputlineEl = document.getElementById('inputline');
const statusEl = document.getElementById('statusbar');

let booting = true;
let outputSink = null;

function scrollBottom() { screenEl.scrollTop = screenEl.scrollHeight; }
function writeLine(text = '', cls = '') {
  if (outputSink) { outputSink.push({ text: String(text), cls }); return; }
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text === '' ? '\u00A0' : text;
  outputEl.appendChild(div);
}
function write(text = '', cls = '') {
  if (outputSink) { outputSink.push({ text: String(text), cls }); return; }
  String(text).split('\n').forEach(l => writeLine(l, cls));
  scrollBottom();
}
function err(text) { write(text, 'err'); }
function progressLine() {
  const div = document.createElement('div');
  div.className = 'line';
  outputEl.appendChild(div);
  scrollBottom();
  return (text) => { div.textContent = text; scrollBottom(); };
}
function okLine(s) {
  const left = s + ' ...';
  const pad = Math.max(2, 56 - left.length);
  return left + ' '.repeat(pad) + '[ OK ]';
}
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function randomHex(len) { let s = ''; for (let i = 0; i < len; i++) s += Math.floor(Math.random()*16).toString(16); return s; }

function updateStatus() {
  const left = statusEl.querySelector('.left');
  const right = statusEl.querySelector('.right');
  if (!left || !right) return;
  const user = currentUser || 'guest';
  const pwd = pathString(cwd);
  const py = pythonRuntimePromise ? 'ready' : 'loading';
  const rec = recording ? '  ● REC' : '';
  const now = new Date();
  const t = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}:${String(now.getSeconds()).padStart(2,'0')}`;
  left.textContent = `${user}@nyx  ${pwd}  [${Storage.backend}]  py:${py}${rec}`;
  right.textContent = t;
}
setInterval(updateStatus, 1000);

/* ============================================================
   PERSISTENCE
   ============================================================ */
const DB_NAME = 'nyx-terminal';
const DB_VERSION = 3;
const STORE = 'fs', SNAP_STORE = 'snapshots', REC_STORE = 'recordings';
const LS_KEY = 'nyx.fs', LS_SNAP_KEY = 'nyx.snapshots', LS_REC_KEY = 'nyx.recordings';
const FS_SCHEMA_VERSION = 2;

function idbOpen() {
  return new Promise((resolve, reject) => {
    if (!('indexedDB' in window)) return reject(new Error('IndexedDB not supported'));
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      for (const s of [STORE, SNAP_STORE, REC_STORE]) if (!db.objectStoreNames.contains(s)) db.createObjectStore(s);
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
function idbGet(h, store, key) {
  return new Promise((res, rej) => {
    const tx = h.transaction(store, 'readonly');
    const r = tx.objectStore(store).get(key);
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
function idbSet(h, store, key, val) {
  return new Promise((res, rej) => {
    const tx = h.transaction(store, 'readwrite');
    tx.objectStore(store).put(val, key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}
function idbDel(h, store, key) {
  return new Promise((res, rej) => {
    const tx = h.transaction(store, 'readwrite');
    tx.objectStore(store).delete(key);
    tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error);
  });
}

const Storage = {
  backend: 'memory', idbHandle: null, errorName: null,
  available: { indexeddb: false, localstorage: false },
  async init() {
    try { this.idbHandle = await idbOpen(); this.available.indexeddb = true; }
    catch (e) { this.errorName = e && e.name ? e.name : String(e); }
    try {
      if ('localStorage' in window) {
        localStorage.setItem('__nyx_probe__','1'); localStorage.removeItem('__nyx_probe__');
        this.available.localstorage = true;
      }
    } catch (e) { if (!this.errorName) this.errorName = e && e.name ? e.name : String(e); }
    this.backend = 'memory';
  },
  setBackend(n) {
    if (n === 'indexeddb' && !this.available.indexeddb) return false;
    if (n === 'localstorage' && !this.available.localstorage) return false;
    this.backend = n; return true;
  },
  async _load(store, lsKey) {
    if (this.backend === 'indexeddb') { try { return await idbGet(this.idbHandle, store, 'all'); } catch (e) { return null; } }
    if (this.backend === 'localstorage') { try { const r = localStorage.getItem(lsKey); return r ? JSON.parse(r) : null; } catch (e) { return null; } }
    return null;
  },
  async _save(store, lsKey, payload) {
    if (this.backend === 'indexeddb') { try { await idbSet(this.idbHandle, store, 'all', payload); } catch (e) {} return; }
    if (this.backend === 'localstorage') { try { localStorage.setItem(lsKey, JSON.stringify(payload)); } catch (e) {} }
  },
  async load() { const p = await this._load(STORE, LS_KEY); if (!p || p.schemaVersion !== FS_SCHEMA_VERSION || !p.tree) return null; return p.tree; },
  async save(tree) { return this._save(STORE, LS_KEY, { schemaVersion: FS_SCHEMA_VERSION, savedAt: Date.now(), tree }); },
  async loadSnapshots() { const p = await this._load(SNAP_STORE, LS_SNAP_KEY); return p && p.snapshots ? p.snapshots : {}; },
  async saveSnapshots(s) { return this._save(SNAP_STORE, LS_SNAP_KEY, { schemaVersion: FS_SCHEMA_VERSION, savedAt: Date.now(), snapshots: s }); },
  async loadRecordings() { const p = await this._load(REC_STORE, LS_REC_KEY); return p && p.recordings ? p.recordings : {}; },
  async saveRecordings(r) { return this._save(REC_STORE, LS_REC_KEY, { schemaVersion: FS_SCHEMA_VERSION, savedAt: Date.now(), recordings: r }); },
  async clear() {
    if (this.backend === 'indexeddb') { try { await idbDel(this.idbHandle, STORE, 'all'); } catch (e) {} return; }
    if (this.backend === 'localstorage') { try { localStorage.removeItem(LS_KEY); } catch (e) {} }
  },
  async wipeAll() {
    try {
      if (this.idbHandle) try { this.idbHandle.close(); } catch(e) {}
      await new Promise(res => {
        const r = indexedDB.deleteDatabase(DB_NAME);
        r.onsuccess = () => res(); r.onerror = () => res(); r.onblocked = () => res();
      });
    } catch (e) {}
    try { for (const k of [LS_KEY, LS_SNAP_KEY, LS_REC_KEY]) localStorage.removeItem(k); } catch (e) {}
    this.idbHandle = null; this.available.indexeddb = false; this.available.localstorage = false; this.backend = 'memory';
  }
};

window.addEventListener('beforeunload', () => {
  try {
    if (Storage.backend === 'indexeddb' && Storage.idbHandle) {
      const tx = Storage.idbHandle.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).put({ schemaVersion: FS_SCHEMA_VERSION, savedAt: Date.now(), tree: FS }, 'all');
    } else if (Storage.backend === 'localstorage') {
      localStorage.setItem(LS_KEY, JSON.stringify({ schemaVersion: FS_SCHEMA_VERSION, savedAt: Date.now(), tree: FS }));
    }
  } catch (e) {}
});
async function saveFS() { return Storage.save(FS); }

/* ============================================================
   FILESYSTEM
   ============================================================ */
const DISK_CAPACITY = 64 * 1024 * 1024;
const DEFAULT_FILE_MODE = 0o644, DEFAULT_DIR_MODE = 0o755;

function makeNode(type, extra = {}) {
  const now = Date.now();
  return Object.assign({ type, owner:'root', group:'root',
    mode: type==='dir' ? DEFAULT_DIR_MODE : DEFAULT_FILE_MODE,
    mtime: now, ctime: now, atime: now }, extra);
}
function mkfile(content, owner='root', mode=DEFAULT_FILE_MODE) { return makeNode('file', { content, owner, group: owner, mode }); }
function mkdir(owner='root', mode=DEFAULT_DIR_MODE) { return makeNode('dir', { children:{}, owner, group: owner, mode }); }

/* ---- /system directory: core nyx runtime files ---- */
const SYSTEM_DIR_NAME = 'system';
const SYSTEM_FILES = [
  ['nyx-core.nyx',   1400],
  ['nyx-lang.nyx',   1300],
  ['nyx-shell.nyx',  1600],
  ['hack-font.ttf',  1800],
  ['nyx-docs.txt',    900],
  ['nyx-fs.nyx',     1100],
  ['nyx-users.nyx',   900],
  ['nyx-init.nyx',   1000]
];

function randomHexContent(len) {
  const chars = '0123456789abcdef';
  let s = '';
  for (let i = 0; i < len; i++) {
    if (i > 0 && i % 65 === 0) s += '\n';
    else s += chars[Math.floor(Math.random() * 16)];
  }
  return s;
}

function makeSystemDirectory() {
  const dir = mkdir('root', 0o555);
  dir.children = {};
  for (const [name, size] of SYSTEM_FILES) {
    dir.children[name] = mkfile(randomHexContent(size), 'root', 0o444);
  }
  return dir;
}

function makeFS() {
  const root = mkdir('root', 0o755);
  root.children = {
    system: makeSystemDirectory(),
    home: mkdir('root'),
    bin: mkdir('root'),
    etc: mkdir('root'),
    tmp: mkdir('root', 0o1777)
  };
  root.children.home.children = {};
  root.children.bin.children = {
    'nyx': mkfile('# Nyx interpreter\n', 'root', 0o755),
    'sh':  mkfile('# shell\n', 'root', 0o755)
  };
  root.children.etc.children = {
    'motd': mkfile('', 'root'),
    'hostname': mkfile('nyx\n', 'root'),
    'passwd': mkfile('', 'root'),
    'shadow': mkfile('', 'root', 0o600)
  };
  root.children.tmp.children = { '.trash': mkdir('root', 0o1777) };
  return root;
}

let FS = makeFS();
let cwd = ['home'];
let snapshots = {};
let recordings = {};
let recording = null;
let lastRecording = null;
let START_TIME = performance.now();

function resolvePath(p) {
  if (!p) return cwd.slice();
  let parts = p.startsWith('/') ? [] : cwd.slice();
  for (const seg of p.split('/')) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') { parts.pop(); continue; }
    parts.push(seg);
  }
  return parts;
}
function getNode(parts) {
  let node = FS;
  for (const seg of parts) { if (node.type !== 'dir' || !node.children[seg]) return null; node = node.children[seg]; }
  return node;
}
function getParent(parts) {
  if (!parts.length) return { parent: null, name: null };
  return { parent: getNode(parts.slice(0, -1)), name: parts[parts.length-1] };
}
function pathString(parts) { return '/' + parts.join('/'); }
function computeUsage() {
  let bytes = 0, files = 0, dirs = 0;
  const walk = n => { if (n.type === 'file') { bytes += (n.content||'').length; files++; } else { dirs++; for (const c of Object.values(n.children)) walk(c); } };
  walk(FS); return { bytes, files, dirs };
}

/* ---- /system protection ---- */
function isProtectedPath(parts) {
  return parts.length > 0 && parts[0] === SYSTEM_DIR_NAME;
}
async function triggerSystemPanic(reason) {
  write('');
  write(`nyx: FATAL: ${reason}`, 'err');
  write(`nyx: integrity check failed — the /system directory is read-only`, 'err');
  write(`nyx: initiating kernel panic to prevent corruption`, 'err');
  write('');
  await sleep(600);
  await commands.kernelpanic.run([], '');
}

/* ============================================================
   USERS / PERMISSIONS
   ============================================================ */
function readUsers() {
  const n = getNode(['etc','passwd']);
  if (!n || !n.content) return [];
  return n.content.split('\n').filter(Boolean).map(line => {
    const p = line.split(':');
    return { username:p[0], uid:parseInt(p[2],10)||0, gid:parseInt(p[3],10)||0, gecos:p[4]||'', home:p[5]||'/', shell:p[6]||'/bin/nyx' };
  });
}
function readShadow() {
  const n = getNode(['etc','shadow']);
  if (!n || !n.content) return {};
  const out = {};
  n.content.split('\n').filter(Boolean).forEach(l => { const i = l.indexOf(':'); if (i>-1) out[l.slice(0,i)] = l.slice(i+1); });
  return out;
}
function writeShadow(m) { const n = getNode(['etc','shadow']); if (n) n.content = Object.entries(m).map(([u,p]) => u+':'+p).join('\n'); }
function userExists(name) { return readUsers().some(u => u.username === name); }
function createUser(username, password) {
  if (userExists(username)) return false;
  const passwd = getNode(['etc','passwd']), shadow = getNode(['etc','shadow']);
  if (!passwd || !shadow) return false;
  let uid, gid, home;
  if (username === 'root') { uid=0; gid=0; home='/root'; }
  else {
    const users = readUsers();
    const maxUid = users.reduce((m,u) => Math.max(m, u.uid===0?999:u.uid), 999);
    uid = Math.max(1000, maxUid+1); gid = uid; home = '/home/' + username;
  }
  const pwdLine = `${username}:x:${uid}:${gid}:${username}:${home}:/bin/nyx`;
  passwd.content = passwd.content ? passwd.content.replace(/\n?$/,'\n') + pwdLine : pwdLine;
  const shdLine = `${username}:${password}`;
  shadow.content = shadow.content ? shadow.content.replace(/\n?$/,'\n') + shdLine : shdLine;
  if (username === 'root' && !FS.children.root) FS.children.root = mkdir('root');
  const hp = home.split('/').filter(Boolean);
  const parent = getNode(hp.slice(0,-1));
  const homeName = hp[hp.length-1];
  if (parent && parent.type === 'dir' && !parent.children[homeName]) {
    parent.children[homeName] = mkdir(username, 0o755);
    parent.children[homeName].children['.profile'] = mkfile(`# ${username}'s profile\n`, username);
  }
  return true;
}
function setPassword(username, password) {
  const m = readShadow();
  if (!(username in m)) return false;
  m[username] = password; writeShadow(m); return true;
}
function isRoot() { return currentUser === 'root'; }
function isOwner(node) { return currentUser && node.owner === currentUser; }
function canRead(node)    { if (isRoot()) return true; if (isOwner(node)) return (node.mode & 0o400) !== 0; return (node.mode & 0o004) !== 0; }
function canWrite(node)   { if (isRoot()) return true; if (isOwner(node)) return (node.mode & 0o200) !== 0; return (node.mode & 0o002) !== 0; }
function canExecute(node) { if (isRoot()) return true; if (isOwner(node)) return (node.mode & 0o100) !== 0; return (node.mode & 0o001) !== 0; }
function modeToString(mode) {
  const b = ['---','--x','-w-','-wx','r--','r-x','rw-','rwx'];
  return b[(mode>>6)&7] + b[(mode>>3)&7] + b[mode&7];
}
function parseMode(s) { return /^[0-7]+$/.test(s) ? parseInt(s,8) : null; }

/* ============================================================
   HELPERS
   ============================================================ */
function levenshtein(a,b) {
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for (let i=0;i<=m;i++) dp[i][0]=i;
  for (let j=0;j<=n;j++) dp[0][j]=j;
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++)
    dp[i][j] = Math.min(dp[i-1][j]+1, dp[i][j-1]+1, dp[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}
function suggestCommands(word) {
  const r = [];
  for (const name of Object.keys(commands)) {
    const d = levenshtein(word, name);
    if (d <= 2 || (name.length > 4 && d <= 3)) r.push({ name, d });
  }
  return r.sort((a,b) => a.d-b.d).slice(0,3).map(r => r.name);
}
function expandGlob(pattern) {
  if (!/[*?]/.test(pattern)) return [pattern];
  const parts = resolvePath(pattern);
  let searchParts, filePat;
  for (let i = parts.length-1; i >= 0; i--) if (/[*?]/.test(parts[i])) { searchParts = parts.slice(0,i); filePat = parts.slice(i).join('/'); break; }
  if (filePat === undefined) return [pattern];
  const dirNode = getNode(searchParts);
  if (!dirNode || dirNode.type !== 'dir') return [pattern];
  const regex = new RegExp('^' + filePat.split('*').map(s => s.replace(/[.+^${}()|[\]\\]/g,'\\$&')).join('[^/]*').replace(/\?/g,'[^/]') + '$');
  const matches = [];
  for (const name of Object.keys(dirNode.children)) if (regex.test(name)) matches.push((searchParts.length ? pathString(searchParts) : '/') + '/' + name);
  return matches.length ? matches : [pattern];
}
function envLookup(name) {
  if (name === 'USER') return currentUser || '';
  if (name === 'HOME') return currentUserObj ? currentUserObj.home : '/home';
  if (name === 'PWD') return pathString(cwd);
  if (name === 'SHELL') return '/bin/nyx';
  if (name === 'HOSTNAME') return 'nyx';
  if (name === 'TERM') return 'hack';
  if (name === 'STORAGE') return Storage.backend;
  return '';
}
function expandEnv(s) { return s.replace(/\$\{(\w+)\}|\$(\w+)/g, (_,a,b) => envLookup(a || b)); }
function splitArgs(str) {
  const out = []; let cur='', q=null;
  for (let i=0;i<str.length;i++) {
    const c = str[i];
    if (q) { if (c === q) q = null; else cur += c; }
    else if (c === '"' || c === "'") q = c;
    else if (c === ' ' || c === '\t') { if (cur) { out.push(cur); cur = ''; } }
    else cur += c;
  }
  if (cur) out.push(cur);
  return out;
}
function splitTopLevel(s, sep) {
  const parts = []; let cur='', q=null;
  for (let i=0;i<s.length;i++) {
    const c = s[i];
    if (q) { cur += c; if (c === q) q = null; continue; }
    if (c === '"' || c === "'") { q = c; cur += c; continue; }
    if (c === sep) { parts.push(cur); cur = ''; continue; }
    cur += c;
  }
  parts.push(cur);
  return parts;
}

/* ============================================================
   NYX interpreter
   ============================================================ */
class NyxError extends Error {}
class ReturnSignal { constructor(v) { this.value = v; } }
function tokenize(src) {
  const t = []; let i = 0;
  const isDigit = c => c >= '0' && c <= '9';
  const isAlpha = c => /[A-Za-z_]/.test(c);
  const isAlnum = c => /[A-Za-z0-9_]/.test(c);
  while (i < src.length) {
    const c = src[i];
    if (' \t\n\r'.includes(c)) { i++; continue; }
    if (c === '#') { while (i < src.length && src[i] !== '\n') i++; continue; }
    if (isDigit(c) || (c === '.' && isDigit(src[i+1]))) {
      let j = i; while (j < src.length && (isDigit(src[j]) || src[j] === '.')) j++;
      t.push({type:'num', value: parseFloat(src.slice(i,j))}); i = j; continue;
    }
    if (c === '"' || c === "'") {
      const q = c; let j = i+1, s = '';

const commands = {};

let pythonRuntimePromise = null;

async function getPythonRuntime() {
  if (!pythonRuntimePromise) {
    pythonRuntimePromise = (async () => {
      const base = 'https://cdn.jsdelivr.net/pyodide/v0.27.7/full/';
      if (typeof window.loadPyodide !== 'function') {
        await new Promise((res, rej) => {
          const s = document.createElement('script'); s.src = base + 'pyodide.js';
          s.onload = res; s.onerror = () => rej(new Error('failed to load pyodide.js'));
          document.head.appendChild(s);
        });
      }
      const py = await window.loadPyodide({indexURL: base});
      await py.loadPackage(['micropip']);
      py.setStdout({batched: msg => write(msg)});
      py.setStderr({batched: msg => err(msg)});
      const stdinFn = async () => {
        if (stdinCharBuffer.length > 0) {
          const code = stdinCharBuffer.charCodeAt(0);
          stdinCharBuffer = stdinCharBuffer.slice(1);
          return code;
        }
        return await new Promise(resolve => {
          stdinPendingResolver = (line) => {
            stdinCharBuffer = line + '\n';
            stdinPendingResolver = null;
            const code = stdinCharBuffer.charCodeAt(0);
            stdinCharBuffer = stdinCharBuffer.slice(1);
            resolve(code);
          };
          if (mode !== 'python-stdin') { mode = 'python-stdin'; updatePrompt(); }
        });
      };
      try { py.setStdin({stdin: stdinFn, isatty: true}); } catch (e) {}
      return py;
    })().catch(e => { pythonRuntimePromise = null; throw e; });
  }
  return pythonRuntimePromise;
}

async function executePythonScript(src, argv) {
  write('Preparing Python runtime...', 'dim');
  const previousMode = mode;
  try {
    const py = await getPythonRuntime();
    const globals = py.runPython('dict()');
    try {
      const argvPy = py.toPy ? py.toPy(argv || []) : (argv || []);
      globals.set('__nyx_argv', argvPy);
      await py.runPythonAsync(`import sys\nsys.argv = list(__nyx_argv)`, {globals});
      await py.runPythonAsync(src, {globals});
    } finally { globals.destroy(); }
  } catch (e) { err('python: ' + (e && e.message ? e.message : String(e))); }
  finally {
    stdinPendingResolver = null; stdinCharBuffer = '';
    mode = previousMode === 'python-stdin' ? 'shell' : previousMode;
    updatePrompt();
  }
}

function fileNodeInfo(node) {
  const isDir = node.type === 'dir';
  const modeStr = (isDir ? 'd' : '-') + modeToString(node.mode);
  const size = isDir ? Object.keys(node.children).length : (node.content || '').length;
  const dateStr = new Date(node.mtime || Date.now()).toISOString().slice(0,16).replace('T',' ');
  return { modeStr, size, dateStr };
}

function readFileArg(args) {
  const path = args.find(a => !a.startsWith('-'));
  if (path) {
    const node = getNode(resolvePath(path));
    if (!node || node.type !== 'file') return null;
    if (!canRead(node)) { err(`permission denied: ${path}`); return undefined; }
    node.atime = Date.now();
    return node.content;
  }

  return null;
}

def('ls', 'listdirectory', 'list directory (-l -a)', (args) => {
  const long = args.some(a => /^-[la]*l[la]*$/.test(a));
  const all = args.some(a => /^-[la]*a[la]*$/.test(a));
  const path = args.find(a => !a.startsWith('-')) || '';
  const node = getNode(resolvePath(path));
  if (!node) return err(`ls: cannot access '${path}'`);
  if (node.type === 'file') {
    if (!canRead(node)) return err(`ls: Permission denied`);
    return long ? writeFileLine(path, node) : write(path);
  }
  if (!canExecute(node)) return err(`ls: Permission denied`);
  const names = Object.keys(node.children).sort().filter(n => all || !n.startsWith('.'));
  if (!names.length) return;
  if (long) {
    write(`total ${names.length}`);
    for (const n of names) writeFileLine(n + (node.children[n].type === 'dir' ? '/' : ''), node.children[n]);
  } else write(names.map(n => node.children[n].type === 'dir' ? n + '/' : n).join('   '));
});
function writeFileLine(name, node) {

}

def('tree', 'showtree', 'directory tree', (args) => {
  const parts = resolvePath(args[0] || '');
  const node = getNode(parts);
  if (!node) return err('tree: not found');
  if (node.type === 'file') return write(args[0]);
  write(parts.length ? parts[parts.length-1] + '/' : '/');
  const walk = (n, prefix) => {
    const names = Object.keys(n.children).sort();
    names.forEach((name, idx) => {
      const last = idx === names.length - 1;
      const child = n.children[name];
      write(prefix + (last ? '└── ' : '├── ') + name + (child.type === 'dir' ? '/' : ''));
      if (child.type === 'dir') walk(child, prefix + (last ? '    ' : '│   '));
    });
  };
  walk(node, '');
});

def('curl', null, 'curl [-o file] <url>', async (args) => {
  const outIdx = args.indexOf('-o');
  const outFile = outIdx >= 0 ? args[outIdx+1] : null;
  const url = args.find((a,i) => !a.startsWith('-') && i !== outIdx+1);
  if (!url) return err('curl: usage: curl [-o file] <url>');
  try {
    write(`fetching ${url}...`, 'dim');
    const res = await fetch(url);
    if (!res.ok) return err(`curl: HTTP ${res.status}`);
    const text = await res.text();
    if (outFile) {
      const parts = resolvePath(outFile);
      if (isProtectedPath(parts)) return triggerSystemPanic(`attempt to write into protected directory: ${outFile}`);
      const { parent, name } = getParent(parts);
      if (!parent || parent.type !== 'dir') return err(`curl: cannot write`);
      parent.children[name] = mkfile(text, currentUser || 'root');
      await saveFS();
      write(`saved ${text.length} bytes to ${outFile}`, 'dim');
    } else write(text);
  } catch (e) { err('curl: ' + (e && e.message ? e.message : String(e))); }
});

def('record', null, 'record start | stop | save <name> | status', async (args) => {
  const sub = args[0];
  if (sub === 'start') {
    if (recording) return err('record: already recording');
    recording = { startedAt: Date.now(), events: [] };
    write('recording started', 'dim'); updateStatus();
  } else if (sub === 'stop') {
    if (!recording) return err('record: not recording');
    const dur = ((Date.now() - recording.startedAt) / 1000).toFixed(1);
    write(`recording stopped — ${dur}s, ${recording.events.length} events`, 'dim');
    lastRecording = recording; recording = null; updateStatus();
  } else if (sub === 'save') {
    const name = args[1];
    if (!name) return err('record: usage: record save <name>');
    const rec = recording || lastRecording;
    if (!rec) return err('record: no recording to save');
    recordings[name] = { savedAt: Date.now(), by: currentUser || 'user', startedAt: rec.startedAt, events: rec.events };
    await Storage.saveRecordings(recordings);
    write(`recording saved as '${name}'`, 'dim');
  } else if (sub === 'status') {
    if (recording) write(`recording — ${((Date.now() - recording.startedAt)/1000).toFixed(1)}s, ${recording.events.length} events`);
    else write('not recording');
  } else write('record: usage: record start | stop | save <name> | status', 'dim');
});

});
def('replay', null, 'replay <name> [speed]', async (args) => {
  const name = args[0];
  if (!name) return err('replay: usage: replay <name> [speed]');
  const rec = recordings[name];
  if (!rec) return err(`replay: '${name}': no such recording`);
  const speed = parseFloat(args[1]) || 4;
  if (isNaN(speed) || speed <= 0) return err('replay: speed must be > 0');
  write(`─── replay '${name}' @ ${speed}x ───`, 'dim');
  let lastT = 0;
  for (const ev of rec.events) {
    const delay = Math.max(0, (ev.t - lastT) / speed);
    if (delay > 0) await sleep(delay);
    lastT = ev.t;
    if (ev.type === 'input') write(`${ev.prompt || '$'} ${ev.text}`);
  }
  write(`─── end replay ───`, 'dim');
});

def('kernelpanic', null, 'simulate kernel panic', async () => {
  mode = 'panic';
  inputlineEl.style.display = 'none';
  const t = () => (performance.now() / 1000).toFixed(6).padStart(10, ' ');
  const rh = len => { let s = ''; for (let i = 0; i < len; i++) s += Math.floor(Math.random()*16).toString(16); return s; };
  write('');
  write(`[   ${t()}] BUG: unable to handle kernel NULL pointer dereference at 0000000000000000`, 'bright');
  await sleep(70);
  write(`[   ${t()}] Oops: 0000 [#1] SMP`);
  await sleep(70);
  write(`[   ${t()}] IP: [<${rh(8)}>] nyx_kernel_init+0x${rh(3)}/0x${rh(3)}`);
  await sleep(90);
  write(`[   ${t()}] Kernel panic - not syncing: Attempted to kill init! exitcode=0x00000009`, 'bright');
  await sleep(200);
  write(`[   ${t()}] -- system halted --`, 'err');
  await sleep(400);
  outputEl.innerHTML = '';
  const face = document.createElement('div'); face.className = 'line bsod-face'; face.textContent = ':('; outputEl.appendChild(face);
  await sleep(400);
  const t1 = document.createElement('div'); t1.className = 'line bsod-title'; t1.textContent = 'NYX has ran into an unrecoverable error.'; outputEl.appendChild(t1);
  const t2 = document.createElement('div'); t2.className = 'line bsod-title'; t2.textContent = 'Will attempt to reboot system in 10..'; outputEl.appendChild(t2);
  for (let n = 10; n >= 1; n--) {
    const d = document.createElement('div'); d.className = 'line'; d.textContent = `Rebooting in ${n}...`;
    if (outputEl.lastChild && outputEl.lastChild.textContent.startsWith('Rebooting')) outputEl.removeChild(outputEl.lastChild);
    outputEl.appendChild(d);
    await sleep(1000);
  }
  outputEl.innerHTML = '';
  history.length = 0; currentUser = null; currentUserObj = null; cwd = ['home'];
  await Storage.clear();
  FS = makeFS();
  inputlineEl.style.display = '';

});

/* Filesystem */
def('mkdir', 'createdirectory', 'mkdir [-p] <dir>', async (args) => {
  const parents = args.includes('-p');
  const path = args.find(a => !a.startsWith('-'));
  if (!path) return err('mkdir: missing operand');
  const parts = resolvePath(path);
  let cur = FS;
  for (let i = 0; i < parts.length; i++) {
    const seg = parts[i];
    if (cur.type !== 'dir') return err(`mkdir: Not a directory`);
    if (!cur.children[seg]) {
      if (!parents && i < parts.length-1) return err(`mkdir: No such file or directory`);
      if (!canWrite(cur)) return err(`mkdir: Permission denied`);
      cur.children[seg] = mkdir(currentUser || 'root');
    } else if (i === parts.length-1) return err(`mkdir: File exists`);
    cur = cur.children[seg];
  }
  await saveFS();
});
def('touch', 'createfile', 'create empty file', async (args) => {
  if (!args[0]) return err('touch: missing operand');
  const parts = resolvePath(args[0]);
  if (isProtectedPath(parts)) return triggerSystemPanic(`attempt to create file in protected directory: ${args[0]}`);
  const { parent, name } = getParent(parts);
  if (!parent) return err(`touch: cannot touch`);
  if (parent.type !== 'dir') return err(`touch: Not a directory`);
  if (!canWrite(parent)) return err(`touch: Permission denied`);
  if (!parent.children[name]) parent.children[name] = mkfile('', currentUser || 'root');
  else parent.children[name].mtime = Date.now();
  await saveFS();
});
def('rm', 'removefile', 'rm [-r] [-f] <file>', async (args) => {
  const recursive = args.some(a => /^-.*r/.test(a));
  const permanent = args.some(a => /^-.*f/.test(a));
  const path = args.find(a => !a.startsWith('-'));
  if (!path) return err('rm: missing operand');
  const parts = resolvePath(path);
  if (isProtectedPath(parts)) return triggerSystemPanic(`attempt to remove protected system file: ${path}`);
  const { parent, name } = getParent(parts);
  if (!parent || !parent.children[name]) return err(`rm: No such file`);
  const node = parent.children[name];
  if (!canWrite(parent)) return err(`rm: Permission denied`);
  if (node.type === 'dir' && !recursive) return err(`rm: Is a directory`);
  if (permanent) delete parent.children[name];
  else {
    const t = trashDir();
    node._original = pathString(parts);
    t.children[`${Date.now()}_${name}`] = node;
    delete parent.children[name];
  }
  await saveFS();
});
def('rmdir', 'removedirectory', 'remove empty dir', async (args) => {
  if (!args[0]) return err('rmdir: missing operand');
  const parts = resolvePath(args[0]);
  if (isProtectedPath(parts)) return triggerSystemPanic(`attempt to remove protected directory: ${args[0]}`);
  const { parent, name } = getParent(parts);
  if (!parent || !parent.children[name]) return err(`rmdir: No such file`);
  const node = parent.children[name];
  if (node.type !== 'dir') return err(`rmdir: Not a directory`);
  if (Object.keys(node.children).length) return err(`rmdir: Not empty`);
  delete parent.children[name];
  await saveFS();
});

  const t = trashDir();

  const original = item._original || args[0];
  const parts = resolvePath(original);
  if (isProtectedPath(parts)) return triggerSystemPanic(`attempt to restore into protected directory: ${original}`);
  const { parent, name } = getParent(parts);
  if (!parent || parent.type !== 'dir') return err(`restore: cannot restore`);
  delete item._original;
  parent.children[name] = item;
  delete t.children[args[0]];
  await saveFS();
  write(`restored to ${original}`, 'dim');
});

def('cp', 'copyfile', 'copy a file', async (args) => {
  if (args.length < 2) return err('cp: usage: cp <src> <dest>');
  const src = getNode(resolvePath(args[0]));
  if (!src) return err(`cp: cannot stat '${args[0]}'`);
  if (src.type === 'dir') return err(`cp: omitting directory`);
  if (!canRead(src)) return err(`cp: Permission denied`);
  const destParts = resolvePath(args[1]);
  const { parent, name } = getParent(destParts);
  if (!parent || parent.type !== 'dir') return err(`cp: cannot create`);
  // Protected: overwriting an existing file inside /system
  if (isProtectedPath(destParts) && parent.children[name]) {
    return triggerSystemPanic(`attempt to overwrite protected system file: ${args[1]}`);
  }
  if (!canWrite(parent)) return err(`cp: Permission denied`);
  parent.children[name] = mkfile(src.content, currentUser || 'root', src.mode);
  await saveFS();
});
def('mv', 'movefile', 'move/rename', async (args) => {
  if (args.length < 2) return err('mv: usage: mv <src> <dest>');
  const srcParts = resolvePath(args[0]);
  const destParts = resolvePath(args[1]);
  if (isProtectedPath(srcParts) || isProtectedPath(destParts)) {
    return triggerSystemPanic(`attempt to move protected system file: ${args[0]} -> ${args[1]}`);
  }
  const { parent: sp, name: sn } = getParent(srcParts);
  if (!sp || !sp.children[sn]) return err(`mv: cannot stat`);
  if (!canWrite(sp)) return err(`mv: Permission denied`);
  const { parent: dpP, name: dn } = getParent(destParts);
  if (!dpP || dpP.type !== 'dir') return err(`mv: cannot move`);
  if (!canWrite(dpP)) return err(`mv: Permission denied`);
  dpP.children[dn] = sp.children[sn];
  delete sp.children[sn];
  await saveFS();
});

/* Disk */
def('usage', 'diskusage', 'disk usage', () => {
  const { bytes, files, dirs } = computeUsage();
  const capKb = DISK_CAPACITY / 1024;
  const usedKb = bytes / 1024;
  const pct = (bytes / DISK_CAPACITY) * 100;
  const barW = 40;
  const filled = Math.min(barW, Math.round((bytes / DISK_CAPACITY) * barW));
  const bar = '█'.repeat(filled) + '░'.repeat(barW - filled);
  write('simulator filesystem usage', 'bright'); write('');
  write(`  files          ${files}`);
  write(`  directories    ${dirs}`);
  write(`  bytes used     ${bytes} B`);
  write(`  kib used       ${usedKb.toFixed(2)} KiB`);
  write(`  capacity       ${capKb.toFixed(0)} KiB`);
  write(`  usage          [${bar}] ${pct.toFixed(3)}%`);
});
def('df', 'diskfree', 'disk free', () => {
  const { bytes } = computeUsage();
  const capKb = Math.floor(DISK_CAPACITY / 1024);
  const usedKb = Math.ceil(bytes / 1024);
  const availKb = Math.max(0, capKb - usedKb);
  const pct = ((usedKb / capKb) * 100).toFixed(0);

def('du', 'directoryusage', 'dir space (-h)', (args) => {

def('cut', 'cutfields', 'cut -cN|-fN [-dX] [file]', (args) => {

  const pos = [];

    const a = args[i];

    else pos.push(a);
  }
  if (!m2 || !range) return err('cut: usage: cut -cN|-cN-M|-fN [-dX] [file]');
  const content = pos.length ? readFileArg(pos) : pipeInput;
  if (content === null || content === undefined) return err('cut: no input');
  const parseRange = (r, max) => {
    if (r.includes('-')) { const [a,b] = r.split('-'); return [a ? parseInt(a,10)-1 : 0, b ? parseInt(b,10) : max]; }

    if (m2 === 'chars') { const [s,e] = parseRange(range, line.length); write(line.slice(s, e)); }

      if (child.type === 'dir') walk(child, full);

  };

  results.forEach(r => write(r));
});

/* ============================================================
   EXECUTION
   ============================================================ */
async function runPipeline(line) {
  const segs = splitTopLevel(line, '|').map(s => s.trim()).filter(s => s.length);
  if (!segs.length) return;
  let prevOut = null;
  for (let i = 0; i < segs.length; i++) {
    let body = segs[i];
    let stdinFile = null, stdoutFile = null, append = false;
    const rApp = body.match(/\s*(>>)\s*([^\s]+)\s*$/);
    const rOut = body.match(/\s*(>)\s*([^\s]+)\s*$/);
    const rIn = body.match(/\s*(<)\s*([^\s]+)\s*$/);
    if (rApp) { stdoutFile = rApp[2]; append = true; body = body.slice(0, rApp.index).trim(); }
    else if (rOut) { stdoutFile = rOut[2]; body = body.slice(0, rOut.index).trim(); }
    if (rIn) { stdinFile = rIn[2]; body = body.slice(0, rIn.index).trim(); }

    if (stdinFile) {
      const n = getNode(resolvePath(stdinFile));
      if (!n || n.type !== 'file') { err(`< ${stdinFile}: No such file`); return; }
      pipeInput = n.content;
    } else pipeInput = prevOut;

    const needCap = i < segs.length - 1 || stdoutFile !== null;
    const sink = needCap ? [] : null;
    outputSink = sink;

    try { await executeSingleCommand(expandEnv(body), {fromPipeline: true}); }
    finally { outputSink = null; pipeInput = null; }

    const out = sink ? sink.map(c => c.text).join('\n') : '';

    if (stdoutFile) {
      const parts = resolvePath(stdoutFile);
      if (isProtectedPath(parts)) {
        return triggerSystemPanic(`attempt to redirect into protected directory: ${stdoutFile}`);
      }
      const { parent, name } = getParent(parts);
      if (!parent || parent.type !== 'dir') { err(`> ${stdoutFile}: Cannot write`); return; }
      if (!canWrite(parent)) { err(`> ${stdoutFile}: Permission denied`); return; }
      const ex = parent.children[name];
      if (append && ex && ex.type === 'file') {
        ex.content = ex.content + (ex.content && !ex.content.endsWith('\n') ? '\n' : '') + out;
        ex.mtime = Date.now();
      } else {
        parent.children[name] = mkfile(out, currentUser || 'root');
      }
      await saveFS();
    } else if (i < segs.length - 1) prevOut = out;
  }
}

async function executeSingleCommand(line, opts = {}) {
  const t = line.trim();
  if (!t) return;
  const sp0 = t.indexOf(' ');
  const firstName = sp0 === -1 ? t : t.slice(0, sp0);
  let working = t;
  if (aliases[firstName]) {
    const rest = sp0 === -1 ? '' : t.slice(sp0);
    working = aliases[firstName] + rest;
  }
  const sp = working.indexOf(' ');
  const name = sp === -1 ? working : working.slice(0, sp);
  let raw = sp === -1 ? '' : working.slice(sp+1).trim();
  let args = splitArgs(raw);
  args = args.flatMap(a => a.startsWith('-') ? [a] : expandGlob(a));
  raw = args.join(' ');
  const cmd = commands[name];
  if (!cmd) {
    err(`nyx: command not found: ${name}`);
    const sug = suggestCommands(name);
    if (sug.length) write(`did you mean: ${sug.join(', ')}?`, 'dim');
    else write(`type 'help' for a list of commands`, 'dim');
    return;
  }
  try { await cmd.run(args, raw); }
  catch (e) { err('nyx: ' + (e && e.message ? e.message : String(e))); }
}

async function executeLine(line, opts = {}) {
  const t = line.trim();

  if (recording && !opts.fromPipeline && !opts.fromScript) {
    recording.events.push({ type:'input', text:line, prompt:promptText(), t:Date.now() - recording.startedAt });
  }

  if ((mode === 'login-user' || mode === 'login-pass' || mode === 'setup-user' || mode === 'setup-pass')
      && t.toLowerCase() === 'resetbootall') {
    write(promptText() + ' ' + line);
    hiddenEl.value = ''; typedEl.textContent = '';
    await commands.resetbootall.run([], '');
    return;
  }
  if (mode === 'storage-select') {
    write(promptText() + ' ' + line);
    const picked = handleStorageSelect(line);
    hiddenEl.value = ''; typedEl.textContent = '';
    if (picked && storageSelectResolver) { const r = storageSelectResolver; storageSelectResolver = null; r(picked); }
    return;
  }
  if (mode === 'setup-user' || mode === 'login-user') {
    write(promptText() + ' ' + line);
    if (mode === 'setup-user') handleSetupUser(line); else handleLoginUser(line);
    hiddenEl.value = ''; typedEl.textContent = '';
    scrollBottom(); return;
  }
  if (isPasswordMode()) {
    write(promptText() + ' ' + '*'.repeat(line.length));
    if (mode === 'setup-pass') handleSetupPass(line);
    else if (mode === 'login-pass') handleLoginPass(line);
    else if (mode === 'adduser-pass') handleAddUserPass(line);
    else if (mode === 'auth-pass') handleAuthPass(line);
    else if (mode === 'passwd-new') handlePasswdNew(line);
    else if (mode === 'passwd-confirm') handlePasswdConfirm(line);
    hiddenEl.value = ''; typedEl.textContent = '';
    scrollBottom(); return;
  }
  if (mode === 'python-stdin') {
    write(promptText() + ' ' + line);
    if (stdinPendingResolver) { const r = stdinPendingResolver; stdinPendingResolver = null; r(line); }
    else write('(no pending Python input request)', 'dim');
    hiddenEl.value = ''; typedEl.textContent = '';
    scrollBottom(); return;
  }

  if (mode === 'repl') {
    write(promptText() + ' ' + line);
    if (t) { history.push(t); histIndex = history.length; histDraft = ''; }
    await handleRepl(line);
    updatePrompt();
    return;
  }
  if (mode === 'edit') {
    write(promptText() + ' ' + line);
    if (t) { history.push(t); histIndex = history.length; histDraft = ''; }
    handleEdit(line);
    updatePrompt();
    return;
  }

  if (!opts.fromPipeline && !opts.fromScript) write(promptText() + ' ' + line);
  if (!opts.fromPipeline && !opts.fromScript && t) { history.push(t); histIndex = history.length; histDraft = ''; }
  if (!t) { updatePrompt(); return; }

  const commaSegs = splitTopLevel(t, ',').map(s => s.trim()).filter(s => s.length);

  if (commaSegs.length <= 1) {
    if (!opts.fromPipeline && !opts.fromScript && (t.includes('|') || /[<>]/.test(t))) {
      await runPipeline(t);
    } else {
      await executeSingleCommand(t, opts);
    }
    updatePrompt();
    return;
  }

  for (let i = 0; i < commaSegs.length; i++) {
    const seg = commaSegs[i];
    if (i > 0) write(`── ${seg} ──`, 'dim');
    if (seg.includes('|') || /[<>]/.test(seg)) await runPipeline(seg);
    else await executeSingleCommand(seg, opts);
  }
  updatePrompt();
}

async function handleRepl(line) {
  const t = line.trim();
  if (['.exit','.quit','exit','quit'].includes(t)) {
    mode = 'shell'; repl = null;
    write('leaving Python REPL', 'dim');
    return;
  }
  if (!t) return;
  try {
    const py = await getPythonRuntime();
    const globals = replGlobals || py.runPython('dict()');
    replGlobals = globals;
    await py.runPythonAsync(line, {globals});
  } catch (e) { err('python: ' + (e && e.message ? e.message : String(e))); }
  finally {
    stdinPendingResolver = null; stdinCharBuffer = '';
    if (mode === 'python-stdin') mode = 'repl';
    updatePrompt();
  }
}

/* ============================================================
   EDITOR
   ============================================================ */
function editSnapshot() {
  if (!editState) return;
  editState.undoStack.push([...editState.lines]);
  if (editState.undoStack.length > 50) editState.undoStack.shift();
}
function parseLineRange(s, max) {
  if (/^\d+-\d+$/.test(s)) { const [a,b] = s.split('-').map(n => parseInt(n,10)); return [Math.max(1,a), Math.min(max,b)]; }
  if (/^\d+$/.test(s)) { const n = parseInt(s,10); return [n,n]; }
  return null;
}
function handleEdit(line) {
  const es = editState;
  if (!es) { mode = 'shell'; return; }
  if (es.pasteMode) {
    if (line === '.end' || line === '..') { es.pasteMode = false; write('(paste mode ended)', 'dim'); return; }
    editSnapshot(); es.lines.push(line); es.dirty = true; return;
  }
  if (line.startsWith('.')) {
    const sp = line.indexOf(' ');
    const cmd = sp === -1 ? line : line.slice(0, sp);
    const rest = sp === -1 ? '' : line.slice(sp+1);
    switch (cmd) {
      case '.exit': case '.quit': case '.q':
        if (es.dirty) { write('unsaved changes — .save or .q!', 'dim'); return; }
        write(`closed ${es.path}`, 'dim'); mode = 'shell'; editState = null; return;
      case '.q!': write(`discarded changes`, 'dim'); mode = 'shell'; editState = null; return;
      case '.w': case '.save': {
        if (isProtectedPath(es.parts)) { mode = 'shell'; editState = null; return triggerSystemPanic(`attempt to save to protected system file: ${es.path}`); }
        const { parent, name } = getParent(es.parts);
        if (!parent || parent.type !== 'dir') { err('edit: cannot save'); return; }
        parent.children[name] = mkfile(es.lines.join('\n'), currentUser || 'root');
        es.dirty = false; write(`saved ${es.lines.length} line(s)`, 'dim');
        saveFS().catch(() => {}); return;
      }
      case '.wq': {
        if (isProtectedPath(es.parts)) { mode = 'shell'; editState = null; return triggerSystemPanic(`attempt to save to protected system file: ${es.path}`); }
        const { parent, name } = getParent(es.parts);
        if (!parent || parent.type !== 'dir') { err('edit: cannot save'); return; }
        parent.children[name] = mkfile(es.lines.join('\n'), currentUser || 'root');
        es.dirty = false; saveFS().catch(() => {});
        write(`saved and closed`, 'dim'); mode = 'shell'; editState = null; return;
      }
      case '.saveas': {
        if (!rest.trim()) { err('edit: usage: .saveas <file>'); return; }
        const parts = resolvePath(rest.trim());
        if (isProtectedPath(parts)) { mode = 'shell'; editState = null; return triggerSystemPanic(`attempt to save into protected directory: ${rest.trim()}`); }
        const { parent, name } = getParent(parts);
        if (!parent || parent.type !== 'dir') { err('edit: cannot save'); return; }
        parent.children[name] = mkfile(es.lines.join('\n'), currentUser || 'root');
        es.path = rest.trim(); es.parts = parts; es.dirty = false;
        saveFS().catch(() => {}); write(`saved as ${es.path}`, 'dim'); return;
      }
      case '.revert': {
        const { parent, name } = getParent(es.parts);
        const ex = parent && parent.children[name];
        editSnapshot();
        if (!ex || ex.type !== 'file') { es.lines = []; es.dirty = false; write('reverted to empty', 'dim'); return; }
        es.lines = ex.content === '' ? [] : ex.content.split('\n');
        es.dirty = false; write(`reverted (${es.lines.length} lines)`, 'dim'); return;
      }
      case '.list': case '.view': {
        if (!es.lines.length) { write('(empty)', 'dim'); return; }
        if (rest.trim()) {
          const r = parseLineRange(rest.trim(), es.lines.length);
          if (!r) { err('edit: usage: .list [N-M]'); return; }
          for (let i = r[0]-1; i < r[1]; i++) write(String(i+1).padStart(4) + '  ' + es.lines[i]);
          return;
        }
        es.lines.forEach((l,i) => write(String(i+1).padStart(4) + '  ' + l)); return;
      }
      case '.clear': editSnapshot(); es.lines = []; es.dirty = true; write('cleared', 'dim'); return;
      case '.del': {
        const r = parseLineRange(rest.trim(), es.lines.length);
        if (!r) { err('edit: usage: .del N or N-M'); return; }
        editSnapshot(); es.lines.splice(r[0]-1, r[1]-r[0]+1); es.dirty = true;
        write(`deleted ${r[1]-r[0]+1} line(s)`, 'dim'); return;
      }
      case '.ins': {
        const m = rest.match(/^(\d+)\s+([\s\S]*)$/);
        if (!m) { err('edit: usage: .ins N text'); return; }
        const n = parseInt(m[1], 10);
        if (n < 1 || n > es.lines.length + 1) { err('edit: line out of range'); return; }
        editSnapshot(); es.lines.splice(n-1, 0, m[2]); es.dirty = true;
        write(`inserted at line ${n}`, 'dim'); return;
      }
      case '.find': {
        if (!rest.trim()) { err('edit: usage: .find <text>'); return; }
        let found = 0;
        es.lines.forEach((l,i) => { if (l.includes(rest)) { write(String(i+1).padStart(4) + '  ' + l); found++; } });
        write(`-- ${found} match${found===1?'':'es'} --`, 'dim'); return;
      }
      case '.re': {
        if (!rest.trim()) { err('edit: usage: .re <regex>'); return; }
        let re; try { re = new RegExp(rest); } catch (e) { return err('edit: invalid regex'); }
        let found = 0;
        es.lines.forEach((l,i) => { if (re.test(l)) { write(String(i+1).padStart(4) + '  ' + l); found++; } });
        write(`-- ${found} match${found===1?'':'es'} --`, 'dim'); return;
      }
      case '.replace': {
        const m = rest.match(/^(\S+)\s+([\s\S]*)$/);
        if (!m) { err('edit: usage: .replace <a> <b>'); return; }
        let count = 0; editSnapshot();
        es.lines = es.lines.map(l => { if (l.includes(m[1])) { count += l.split(m[1]).length-1; return l.split(m[1]).join(m[2]); } return l; });
        es.dirty = true; write(`replaced ${count}`, 'dim'); return;
      }
      case '.rreplace': {
        const m = rest.match(/^(\S+)\s+([\s\S]*)$/);
        if (!m) { err('edit: usage: .rreplace <regex> <repl>'); return; }
        let re; try { re = new RegExp(m[1], 'g'); } catch (e) { return err('edit: bad regex'); }
        let count = 0; editSnapshot();
        es.lines = es.lines.map(l => { const mm = l.match(re); if (mm) count += mm.length; return l.replace(re, m[2]); });
        es.dirty = true; write(`replaced ${count}`, 'dim'); return;
      }
      case '.sort': { if (!es.lines.length) { write('(empty)', 'dim'); return; } editSnapshot(); es.lines.sort(); es.dirty = true; write('sorted', 'dim'); return; }
      case '.move': {
        const m = rest.match(/^(\d+)\s+(\d+)$/);
        if (!m) { err('edit: usage: .move <from> <to>'); return; }
        const f = parseInt(m[1],10), t = parseInt(m[2],10);
        if (f<1||f>es.lines.length||t<1||t>es.lines.length) { err('edit: line out of range'); return; }
        editSnapshot(); const [ln] = es.lines.splice(f-1,1); es.lines.splice(t-1,0,ln); es.dirty = true;
        write('moved', 'dim'); return;
      }
      case '.copy': {
        const m = rest.match(/^(\d+)\s+(\d+)$/);
        if (!m) { err('edit: usage: .copy <from> <to>'); return; }
        const f = parseInt(m[1],10), t = parseInt(m[2],10);
        if (f<1||f>es.lines.length||t<1||t>es.lines.length+1) { err('edit: line out of range'); return; }
        editSnapshot(); es.lines.splice(t-1,0, es.lines[f-1]); es.dirty = true;
        write('copied', 'dim'); return;
      }
      case '.yank': {
        const r = parseLineRange(rest.trim(), es.lines.length);
        if (!r) { err('edit: usage: .yank N or N-M'); return; }
        es.clipboard = es.lines.slice(r[0]-1, r[1]).join('\n');
        write(`yanked lines ${r[0]}-${r[1]}`, 'dim'); return;
      }
      case '.paste': {
        if (es.clipboard === null) { err('edit: clipboard empty'); return; }
        editSnapshot(); es.lines.push(...es.clipboard.split('\n')); es.dirty = true;
        write('pasted', 'dim'); return;
      }
      case '.multi': es.pasteMode = true; write('multi-line paste mode — .end to finish', 'dim'); return;
      case '.export': {
        const m = rest.match(/^(\S+)\s+(\S+)$/);
        if (!m) { err('edit: usage: .export <N-M> <file>'); return; }
        const r = parseLineRange(m[1], es.lines.length);
        if (!r) { err('edit: bad range'); return; }
        const content = es.lines.slice(r[0]-1, r[1]).join('\n');
        const parts = resolvePath(m[2]);
        if (isProtectedPath(parts)) { mode = 'shell'; editState = null; return triggerSystemPanic(`attempt to export into protected directory: ${m[2]}`); }
        const { parent, name } = getParent(parts);
        if (!parent || parent.type !== 'dir') { err('edit: cannot export'); return; }
        parent.children[name] = mkfile(content, currentUser || 'root');
        saveFS().catch(() => {});
        write(`exported lines ${r[0]}-${r[1]} to ${m[2]}`, 'dim'); return;
      }
      case '.undo': {
        if (!es.undoStack.length) { err('edit: nothing to undo'); return; }
        es.lines = es.undoStack.pop(); es.dirty = true;
        write(`undo (${es.undoStack.length} more)`, 'dim'); return;
      }
      case '.stats': {
        const text = es.lines.join('\n');
        write(`lines: ${es.lines.length}`);
        write(`words: ${text.split(/\s+/).filter(Boolean).length}`);
        write(`chars: ${text.length}`);
        write(`dirty: ${es.dirty ? 'yes' : 'no'}`);
        write(`undo: ${es.undoStack.length}`);
        return;
      }
      case '.help':
        write('  .list [N-M]      show lines');
        write('  .find <text>     substring search');
        write('  .re <regex>      regex search');
        write('  .ins N text      insert');
        write('  .del N | N-M     delete');
        write('  .move N M        move line');
        write('  .copy N M        copy line');
        write('  .sort            sort');
        write('  .replace a b     substring replace');
        write('  .rreplace re r   regex replace');
        write('  .yank .paste .multi .undo .export');
        write('  .save .saveas .wq .revert .exit .q!');
        return;
      default: err('edit: unknown command ' + cmd); return;
    }
  }
  es.lines.push(line); es.dirty = true;
}

/* ============================================================
   STORAGE SELECTION
   ============================================================ */
function handleStorageSelect(line) {
  const t = line.trim();
  let picked = null;
  if (t === '') picked = Storage.available.indexeddb ? 'indexeddb' : Storage.available.localstorage ? 'localstorage' : 'memory';
  else if (t === '1') picked = 'memory';
  else if (t === '2') picked = Storage.available.indexeddb ? 'indexeddb' : null;
  else if (t === '3') picked = Storage.available.localstorage ? 'localstorage' : null;
  else if (['memory','indexeddb','localstorage','idb','ls','session'].includes(t.toLowerCase())) {
    const map = {memory:'memory', indexeddb:'indexeddb', idb:'indexeddb', localstorage:'localstorage', ls:'localstorage', session:'memory'};
    const want = map[t.toLowerCase()];
    if (want === 'indexeddb' && !Storage.available.indexeddb) picked = null;
    else if (want === 'localstorage' && !Storage.available.localstorage) picked = null;
    else picked = want;
  }
  if (!picked) {
    if (t === '2' && !Storage.available.indexeddb) write('IndexedDB unavailable — pick 1 or 3', 'err');
    else if (t === '3' && !Storage.available.localstorage) write('localStorage unavailable — pick 1 or 2', 'err');
    else write('invalid choice — try 1, 2, or 3', 'err');
    return null;
  }
  Storage.setBackend(picked);
  return picked;
}

/* ============================================================
   SETUP / LOGIN
   ============================================================ */
function startSetup() {
  write('no users found on this system', 'dim');
  write('create the first account to continue'); write('');
  mode = 'setup-user'; setupState = {username: null};
  updatePrompt(); hiddenEl.focus(); scrollBottom();
}
function handleSetupUser(username) {
  username = username.trim();
  if (!username) { err('username cannot be empty'); return updatePrompt(); }
  if (!/^[A-Za-z_][A-Za-z0-9_-]*$/.test(username)) { err('invalid username'); return updatePrompt(); }
  if (userExists(username)) { err(`user '${username}' already exists`); return updatePrompt(); }
  setupState.username = username; mode = 'setup-pass'; updatePrompt();
}
function handleSetupPass(password) {
  if (!setupState || !setupState.username) { mode = 'shell'; return updatePrompt(); }
  if (!password) { err('password cannot be empty'); return updatePrompt(); }
  const u = setupState.username;
  if (!createUser(u, password)) { err('failed to create user'); mode = 'setup-user'; setupState = {username:null}; return updatePrompt(); }
  const user = readUsers().find(x => x.username === u);
  currentUser = u; currentUserObj = user;
  cwd = (user.home || '/').split('/').filter(Boolean);
  mode = 'shell'; setupState = null;
  write(''); write(`account '${u}' created and saved`, 'dim'); write('');
  saveFS().catch(() => {});
  showWelcome(); updatePrompt();
}
function startLogin() {
  write('login required', 'dim'); write('');
  mode = 'login-user'; loginState = {username: null};
  updatePrompt(); hiddenEl.focus(); scrollBottom();
}
function handleLoginUser(username) {
  username = username.trim();
  if (!username) return updatePrompt();
  const u = readUsers().find(x => x.username === username);
  if (!u) { err('login incorrect'); return updatePrompt(); }
  loginState.username = username; mode = 'login-pass'; updatePrompt();
}
function handleLoginPass(password) {
  if (!loginState || !loginState.username) { mode = 'login-user'; return updatePrompt(); }
  const sh = readShadow();
  if (!(loginState.username in sh) || sh[loginState.username] !== password) {
    err('login incorrect'); loginState = null; mode = 'login-user'; return updatePrompt();
  }
  const u = readUsers().find(x => x.username === loginState.username);
  currentUser = loginState.username; currentUserObj = u;
  cwd = (u.home || '/').split('/').filter(Boolean);
  loginState = null; mode = 'shell';
  showWelcome(); updatePrompt();
}
function handleAddUserPass(password) {
  if (!pendingAddUser) { mode = 'shell'; return updatePrompt(); }
  const { username } = pendingAddUser;
  if (!password) { err('password may not be empty'); pendingAddUser = null; mode = 'shell'; return updatePrompt(); }
  if (!createUser(username, password)) err(`adduser: failed`);
  else write(`user '${username}' created`, 'dim');
  pendingAddUser = null; mode = 'shell';
  saveFS().catch(() => {}); updatePrompt();
}
function handleAuthPass(password) {
  if (!pendingAuth) { mode = 'shell'; return updatePrompt(); }
  const { username } = pendingAuth;
  const sh = readShadow();
  if (!(username in sh) || sh[username] !== password) {
    write('Authentication failure'); pendingAuth = null; mode = 'shell'; return updatePrompt();
  }
  const u = readUsers().find(x => x.username === username);
  if (!u) { err(`su: user disappeared`); pendingAuth = null; mode = 'shell'; return updatePrompt(); }
  currentUser = username; currentUserObj = u;
  cwd = (u.home || '/').split('/').filter(Boolean);
  pendingAuth = null; mode = 'shell';
  write(''); showWelcome(); updatePrompt();
}
function handlePasswdNew(password) {
  if (!password) { err('password may not be empty'); pendingPasswd = null; mode = 'shell'; return updatePrompt(); }
  pendingPasswd.newPassword = password; mode = 'passwd-confirm'; updatePrompt();
}
function handlePasswdConfirm(password) {
  if (!pendingPasswd || password !== pendingPasswd.newPassword) {
    err('passwords do not match'); pendingPasswd = null; mode = 'shell'; return updatePrompt();
  }
  setPassword(currentUser, password);
  write('password updated successfully');
  pendingPasswd = null; mode = 'shell';
  saveFS().catch(() => {}); updatePrompt();
}

/* ============================================================
   INPUT
   ============================================================ */
hiddenEl.addEventListener('input', () => {
  const v = hiddenEl.value;
  if (reverseSearchActive) { reverseSearchQuery = v; revSearchUpdate(); return; }
  if (paletteActive) { paletteQuery = v; paletteUpdate(); return; }
  typedEl.textContent = isPasswordMode() ? '*'.repeat(v.length) : v;
  scrollBottom();
});

hiddenEl.addEventListener('keydown', async (e) => {
  if (booting && mode !== 'storage-select') { e.preventDefault(); return; }
  if (mode === 'panic') { e.preventDefault(); return; }

  if (e.ctrlKey && e.key === 'r') {
    e.preventDefault();
    if (!reverseSearchActive) enterRevSearch(); else revSearchUpdate();
    return;
  }
  if (e.ctrlKey && e.key === 'p') {
    e.preventDefault();
    if (!paletteActive) enterPalette();
    return;
  }
  if (e.ctrlKey && (e.key === '=' || e.key === '+')) {
    e.preventDefault();
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fontscale')) || 14;
    document.documentElement.style.setProperty('--fontscale', String(Math.min(40, cur + 2)));
    return;
  }
  if (e.ctrlKey && e.key === '-') {
    e.preventDefault();
    const cur = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fontscale')) || 14;
    document.documentElement.style.setProperty('--fontscale', String(Math.max(8, cur - 2)));
    return;
  }
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); outputEl.innerHTML = ''; scrollBottom(); return; }

  if (reverseSearchActive) {
    if (e.key === 'Enter') { e.preventDefault(); exitRevSearch(true); return; }
    if (e.key === 'Escape') { e.preventDefault(); exitRevSearch(false); return; }
    if (e.key === 'c' && e.ctrlKey) { e.preventDefault(); exitRevSearch(false); return; }
    return;
  }
  if (paletteActive) {
    if (e.key === 'Enter') { e.preventDefault(); exitPalette(true); return; }
    if (e.key === 'Escape') { e.preventDefault(); exitPalette(false); return; }
    if (e.key === 'ArrowUp') { e.preventDefault(); paletteIndex = Math.max(0, paletteIndex - 1); paletteRender(); return; }
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteIndex = Math.min(paletteMatches.length-1, paletteIndex+1); paletteRender(); return; }
    return;
  }

  if (e.key === 'Enter') {
    e.preventDefault();
    const line = hiddenEl.value;
    hiddenEl.value = ''; typedEl.textContent = '';
    await executeLine(line);
    scrollBottom();
    return;
  }
  if (e.key === 'c' && e.ctrlKey) { e.preventDefault(); onCtrlC(); return; }
  if (e.key === 'ArrowUp') {
    if (isPasswordMode() || ['setup-user','login-user','python-stdin','storage-select'].includes(mode)) return;
    e.preventDefault(); navHistory(-1);
  } else if (e.key === 'ArrowDown') {
    if (isPasswordMode() || ['setup-user','login-user','python-stdin','storage-select'].includes(mode)) return;
    e.preventDefault(); navHistory(1);
  } else if (e.key === 'Tab') {
    if (isPasswordMode() || ['setup-user','login-user','python-stdin','storage-select'].includes(mode)) { e.preventDefault(); return; }
    e.preventDefault(); complete();
  }
});

function onCtrlC() {
  if (mode === 'storage-select') {
    write('Choice ^C'); write('(defaulting)', 'dim');
    hiddenEl.value = ''; typedEl.textContent = '';
    if (storageSelectResolver) { const r = storageSelectResolver; storageSelectResolver = null; r('default'); }
    return;
  }
  if (mode === 'setup-user' || mode === 'login-user') { write(promptText() + ' ^C'); hiddenEl.value = ''; typedEl.textContent = ''; return; }
  if (mode === 'setup-pass') { write('password: ^C'); write('(back to username)', 'dim'); hiddenEl.value = ''; typedEl.textContent = ''; mode = 'setup-user'; if (setupState) setupState.username = null; updatePrompt(); return; }
  if (mode === 'login-pass') { write('password: ^C'); write('(back to username)', 'dim'); hiddenEl.value = ''; typedEl.textContent = ''; mode = 'login-user'; if (loginState) loginState.username = null; updatePrompt(); return; }
  if (mode === 'auth-pass') { hiddenEl.value = ''; typedEl.textContent = ''; pendingAuth = null; mode = 'shell'; updatePrompt(); return; }
  if (mode === 'adduser-pass' || mode === 'passwd-new' || mode === 'passwd-confirm') { hiddenEl.value = ''; typedEl.textContent = ''; pendingAddUser = null; pendingPasswd = null; mode = 'shell'; updatePrompt(); return; }
  if (mode === 'python-stdin') { if (stdinPendingResolver) { const r = stdinPendingResolver; stdinPendingResolver = null; r(''); } write('> ^C'); hiddenEl.value = ''; typedEl.textContent = ''; return; }
  if (mode === 'edit' && editState) { write(promptText() + ' ' + hiddenEl.value + '^C'); hiddenEl.value = ''; typedEl.textContent = ''; write('(still in editor)', 'dim'); return; }
  write(promptText() + ' ' + hiddenEl.value + '^C');
  hiddenEl.value = ''; typedEl.textContent = '';
}

function navHistory(dir) {
  if (!history.length) return;
  if (dir < 0) {
    if (histIndex === history.length) histDraft = hiddenEl.value;
    histIndex = Math.max(0, histIndex - 1);
  } else histIndex = Math.min(history.length, histIndex + 1);
  hiddenEl.value = histIndex === history.length ? histDraft : history[histIndex];
  typedEl.textContent = hiddenEl.value;
  scrollBottom();
}

function complete() {
  if (mode !== 'shell') return;
  const val = hiddenEl.value;
  const parts = val.split(' ');
  if (parts.length === 1) {
    const matches = Object.keys(commands).filter(c => c.startsWith(val) && c !== val);
    if (matches.length === 1) hiddenEl.value = matches[0] + ' ';
    else if (matches.length > 1) { write(promptText() + ' ' + val); write(matches.sort().join('   ')); }
  } else {
    const last = parts[parts.length-1];
    const node = getNode(cwd);
    const names = node && node.type === 'dir' ? Object.keys(node.children) : [];
    const matches = names.filter(n => n.startsWith(last));
    if (matches.length === 1) { parts[parts.length-1] = matches[0]; hiddenEl.value = parts.join(' '); }
    else if (matches.length > 1) { write(promptText() + ' ' + val); write(matches.sort().join('   ')); }
  }
  typedEl.textContent = hiddenEl.value;
  scrollBottom();
}

function enterRevSearch() { reverseSearchActive = true; reverseSearchQuery = ''; reverseSearchMatch = null; hiddenEl.value = ''; typedEl.textContent = ''; updatePrompt(); }
function revSearchUpdate() {
  reverseSearchMatch = null;
  for (let i = history.length - 1; i >= 0; i--) if (history[i].toLowerCase().includes(reverseSearchQuery.toLowerCase())) { reverseSearchMatch = history[i]; break; }
  typedEl.textContent = reverseSearchMatch || '';
  promptEl.textContent = `(reverse-i-search)\`${reverseSearchQuery}': `;
}
function exitRevSearch(accept) {
  reverseSearchActive = false;
  if (accept && reverseSearchMatch) { hiddenEl.value = reverseSearchMatch; typedEl.textContent = reverseSearchMatch; }
  else { hiddenEl.value = ''; typedEl.textContent = ''; }
  updatePrompt();
}
function enterPalette() { paletteActive = true; paletteQuery = ''; paletteIndex = 0; paletteMatches = Object.keys(commands).sort(); paletteRender(); hiddenEl.value = ''; }
function paletteUpdate() { paletteMatches = Object.keys(commands).filter(c => c.startsWith(paletteQuery)).sort(); if (paletteIndex >= paletteMatches.length) paletteIndex = Math.max(0, paletteMatches.length-1); paletteRender(); }
function paletteRender() {
  const preview = paletteMatches.slice(0, 6);
  if (!preview.length) { typedEl.textContent = '(no matches)'; return; }
  typedEl.textContent = paletteQuery + '   ' + preview.map((m,i) => (i === paletteIndex ? `▸ ${m}` : `  ${m}`)).join('  |  ');
}
function exitPalette(accept) {
  paletteActive = false;
  if (accept && paletteMatches.length) { hiddenEl.value = paletteMatches[paletteIndex] + ' '; typedEl.textContent = hiddenEl.value; }
  else { hiddenEl.value = ''; typedEl.textContent = ''; }
  updatePrompt();
}

/* ============================================================
   BOOT SEQUENCE
   ============================================================ */
function showWelcome() {
  write(' ███╗   ██╗██╗   ██╗██╗  ██╗', 'bright');
  write(' ████╗  ██║╚██╗ ██╔╝╚██╗██╔╝', 'bright');
  write(' ██╔██╗ ██║ ╚████╔╝  ╚███╔╝ ', 'bright');
  write(' ██║╚██╗██║  ╚██╔╝   ██╔██╗ ', 'bright');
  write(' ██║ ╚████║   ██║   ██╔╝ ██╗', 'bright');
  write(' ╚═╝  ╚═══╝   ╚═╝   ╚═╝  ╚═╝', 'bright');
  write('');
  write(`type 'help'. separators:  ,  |  > >> <`, 'dim');
  write(`storage: ${Storage.backend}`, 'dim');
  write('');
}

async function bootSequence() {
  booting = true;
  inputlineEl.style.display = 'none';

  writeLine('');
  writeLine('tip: click anywhere to go fullscreen. works during boot too.', 'dim');
  writeLine('');

  await sleep(200);
  const earlySteps = [
    'Configuring ISA PnP',
    'Setting system time from the hardware clock (localtime).',
    'Using /etc/random-seed to initialize /dev/urandom.',
    'Initializing basic system settings ...',
    'Updating shared libraries',
    'Setting hostname: nyx.kernel.org',
    'INIT: Entering runlevel: 4',
    'rc.M ==> Going multiuser...'
  ];
  for (const s of earlySteps) { writeLine(s); scrollBottom(); await sleep(110); }
  await sleep(150);

  const okSteps = [
    'Starting system logger','Initialising advanced hardware','Setting up modules',
    'Initialising network','Setting up localhost','Setting up inet1',
    'Setting up route','Setting up fancy console and GUI','Loading fc-cache'
  ];
  for (const s of okSteps) { writeLine(okLine(s)); scrollBottom(); await sleep(140); }

  writeLine('rc.ulimit ==> Going to runlevel 4');
  await sleep(250);
  writeLine('');

  writeLine('Fetching nyx runtime ...', 'bright');
  writeLine('');
  await sleep(250);

  const packages = [
    ['nyx-core',   850],['nyx-lang',   650],['nyx-shell',  750],['hack-font',  500],
    ['nyx-docs',   600],['nyx-fs',     900],['nyx-users',  550],['nyx-init',   450]
  ];
  const barWidth = 28;
  for (const [name, dur] of packages) {
    const setLine = progressLine();
    const steps = 22;
    const stepTime = dur / steps;
    for (let i = 0; i <= steps; i++) {
      const pct = Math.round((i / steps) * 100);
      const filled = Math.round((i / steps) * barWidth);
      const bar = '█'.repeat(filled) + '░'.repeat(barWidth - filled);
      setLine(`  ${name.padEnd(11)} [${bar}] ${String(pct).padStart(3)}%`);
      await sleep(stepTime);
    }
    setLine(`  ${name.padEnd(11)} [${'█'.repeat(barWidth)}] 100%   [ OK ]`);
  }
  writeLine('');
  writeLine('  packages installed to /system/', 'dim');

  writeLine('');
  writeLine('Installing bootloader ...', 'bright');
  await sleep(350);

  writeLine('');
  writeLine('Python runtime bootstrap', 'bright');
  writeLine('The following components are fetched from the Pyodide CDN on first boot.', 'dim');
  const pythonStatus = progressLine();
  const pythonSpinnerLine = progressLine();
  const pythonSpinner = ['|', '/', '-', '\\'];
  let pythonStatusIndex = 0;
  let pythonFinished = false;
  const spinnerLoop = (async () => {
    while (!pythonFinished) {
      pythonSpinnerLine('  [ ' + pythonSpinner[pythonStatusIndex++ % pythonSpinner.length] + ' ] Downloading / initializing Python components ...');
      await sleep(120);
    }
  })();
  try {
    await getPythonRuntime();
    pythonStatus('  [ OK ] Python runtime, standard library, and micropip ready');
    pythonSpinnerLine('  [ OK ] Boot-time Python preload complete');
  } catch (e) {
    pythonStatus('  [ FAILED ] Python runtime could not be loaded');
    pythonSpinnerLine('  [ FAILED ] Boot-time Python preload incomplete');
    writeLine('  Python bootstrap error: ' + (e && e.message ? e.message : String(e)), 'err');
  } finally { pythonFinished = true; await spinnerLoop; }
  writeLine('');

  // ---- Storage backend selection ----
  writeLine('');
  writeLine('Storage backend selection', 'bright');
  writeLine('=========================', 'bright');
  writeLine('');
  writeLine('Nyx needs to know where to keep your files between sessions.');
  writeLine('');

  const idbOK = Storage.available.indexeddb;
  const lsOK  = Storage.available.localstorage;

  writeLine('  [1] Session only      - 64 MiB in memory, wiped when the tab closes');
  writeLine(`  [2] IndexedDB         - ${idbOK ? 'survives reloads, large capacity (recommended)' : 'unavailable on this browser'}`);
  writeLine(`  [3] localStorage      - ${lsOK ? 'survives reloads, ~5 MB limit' : 'unavailable on this browser'}`);
  writeLine('');
  writeLine('If you forget your username or password later, type "resetbootall"', 'dim');
  writeLine('at the login prompt to wipe all stored data and start over.', 'dim');
  writeLine('');

  inputlineEl.style.display = '';
  booting = false;
  mode = 'storage-select';
  updatePrompt();
  hiddenEl.focus();
  scrollBottom();

  const picked = await new Promise(resolve => { storageSelectResolver = resolve; });

  mode = 'shell';
  booting = true;
  inputlineEl.style.display = 'none';
  hiddenEl.value = '';
  typedEl.textContent = '';

  if (picked === 'default' || !picked) {
    Storage.setBackend(
      Storage.available.indexeddb ? 'indexeddb'
      : Storage.available.localstorage ? 'localstorage'
      : 'memory'
    );
  }

  const labelMap = { indexeddb:'IndexedDB', localstorage:'localStorage', memory:'Session only (memory)' };
  writeLine(`  [ OK ] Storage backend: ${labelMap[Storage.backend]}`);
  writeLine('');

  writeLine('Mounting nyxfs ...', 'bright');
  const restored = await Storage.load();
  if (restored) {
    FS = restored;
    // Ensure /system still exists — restore it if a snapshot was taken
    // before the /system directory was introduced.
    if (!FS.children[SYSTEM_DIR_NAME]) FS.children[SYSTEM_DIR_NAME] = makeSystemDirectory();
    const { files, dirs } = computeUsage();
    writeLine(`  [ OK ] Restored ${files} file(s), ${dirs} dir(s)`);
  } else {
    FS = makeFS();
    if (Storage.backend !== 'memory') await saveFS();
    writeLine(`  [ OK ] Initialized fresh nyxfs`);
  }
  writeLine('');

  const finalSteps = [
    'Writing nyxfs superblock','Setting up /home','Initializing /etc/passwd (empty)',
    'Initializing /etc/shadow (empty)','Registering Nyx runtime','Finalizing startup'
  ];
  for (const s of finalSteps) { writeLine(okLine(s)); scrollBottom(); await sleep(140); }

  writeLine('');
  await sleep(300);
  writeLine('nyx is ready.', 'bright');
  writeLine('');
  await sleep(550);

  booting = false;
  inputlineEl.style.display = '';
  updateStatus();

  if (readUsers().length === 0) startSetup();
  else startLogin();
}

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  updatePrompt();
  document.addEventListener('click', async () => {
    if (!document.fullscreenElement) {
      try { await document.documentElement.requestFullscreen(); } catch (e) {}
    }
    if (!booting && mode !== 'panic') hiddenEl.focus();
  });
  try { hiddenEl.focus(); } catch (e) {}
  await Storage.init();
  snapshots = await Storage.loadSnapshots();
  recordings = await Storage.loadRecordings();
  bootSequence();
}
init();
</script>
